apiVersion: 1

# Grafana 13 supplies the empty receiver without notification integrations.
# Alert evaluation remains active. This child route suppresses delivery until an
# operator-owned contact point and recipient are explicitly selected.
muteTimes:
  - orgId: 1
    name: geul-alert-notifications-disabled
    time_intervals:
      - times:
          - start_time: '00:00'
            end_time: '24:00'
        location: UTC

policies:
  - orgId: 1
    receiver: empty
    group_by: [grafana_folder, alertname]
    routes:
      - receiver: empty
        object_matchers:
          - [notification_stage, '=', disabled]
        mute_time_intervals:
          - geul-alert-notifications-disabled
