auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    kvstore:
      store: inmemory
    instance_addr: 127.0.0.1
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: '2024-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  retention_period: ${GEUL_LOKI_APPLICATION_RETENTION_PERIOD}
  retention_stream:
    - selector: '{retention_class="application"}'
      priority: 1
      period: ${GEUL_LOKI_APPLICATION_RETENTION_PERIOD}
    - selector: '{retention_class="diagnostic"}'
      priority: 1
      period: ${GEUL_LOKI_DIAGNOSTIC_RETENTION_PERIOD}
    - selector: '{retention_class="system"}'
      priority: 1
      period: ${GEUL_LOKI_SYSTEM_RETENTION_PERIOD}
  max_query_length: 30d1h
  max_entries_limit_per_query: 5000
  split_queries_by_interval: 1h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
