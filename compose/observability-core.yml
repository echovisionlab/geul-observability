name: geul-observability-core

services:
  loki-prod:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: geul-loki-prod
    ports:
      - '3100:3100'
    volumes:
      - ../infra/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data_prod:/loki
    environment:
      GEUL_LOKI_APPLICATION_RETENTION_PERIOD: ${GEUL_LOKI_APPLICATION_RETENTION_PERIOD:-2160h}
      GEUL_LOKI_DIAGNOSTIC_RETENTION_PERIOD: ${GEUL_LOKI_DIAGNOSTIC_RETENTION_PERIOD:-720h}
      GEUL_LOKI_SYSTEM_RETENTION_PERIOD: ${GEUL_LOKI_SYSTEM_RETENTION_PERIOD:-2232h}
    command:
      - -config.file=/etc/loki/local-config.yaml
      - -config.expand-env=true
    restart: unless-stopped

  tempo-prod:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    container_name: geul-tempo-prod
    ports:
      - '3200:3200'
    volumes:
      - ../infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data_prod:/var/tempo
    command: -config.file=/etc/tempo/tempo.yml
    restart: unless-stopped

  mimir-prod:
    image: grafana/mimir:3.2.1@sha256:92838f113ba54230014e79bc812e57ca90bb9ebc06e665f59e4f700098c2dd04
    container_name: geul-mimir-prod
    ports:
      - '9009:9009'
    volumes:
      - ../infra/mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir_data_prod:/data
    command: -config.file=/etc/mimir/mimir.yml
    restart: unless-stopped

  alloy-prod:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: geul-alloy-prod
    ports:
      - '4317:4317'
      - '4318:4318'
      - '12345:12345'
    environment:
      GEUL_POSTGRES_OBSERVER_DSN: ${GEUL_POSTGRES_OBSERVER_DSN:?set GEUL_POSTGRES_OBSERVER_DSN}
    volumes:
      - ../infra/alloy/config.prod.alloy:/etc/alloy/config.alloy:ro
      - ../infra/alloy/postgres-queries.yml:/etc/alloy/postgres-queries.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data_prod:/var/lib/alloy/data
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki-prod
      - tempo-prod
      - mimir-prod
    restart: unless-stopped

volumes:
  alloy_data_prod:
  loki_data_prod:
  tempo_data_prod:
  mimir_data_prod:
