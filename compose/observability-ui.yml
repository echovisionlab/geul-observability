name: geul-observability-ui

services:
  grafana-prod:
    image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    container_name: geul-grafana-prod
    ports:
      - '3500:3000'
    volumes:
      - ../infra/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ../infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../infra/grafana/provisioning/datasources/datasources.prod.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../infra/grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
      - ../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data_prod:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GEUL_GRAFANA_ADMIN_USER:?set GEUL_GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GEUL_GRAFANA_ADMIN_PASSWORD:?set GEUL_GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GEUL_GRAFANA_ROOT_URL:?set GEUL_GRAFANA_ROOT_URL}
      - GEUL_GRAFANA_POSTGRES_USER=${GEUL_GRAFANA_POSTGRES_USER:?set GEUL_GRAFANA_POSTGRES_USER}
      - GEUL_GRAFANA_POSTGRES_PASSWORD=${GEUL_GRAFANA_POSTGRES_PASSWORD:?set GEUL_GRAFANA_POSTGRES_PASSWORD}
      - GEUL_MIMIR_URL=${GEUL_MIMIR_URL:?set GEUL_MIMIR_URL}
      - GEUL_LOKI_URL=${GEUL_LOKI_URL:?set GEUL_LOKI_URL}
      - GEUL_TEMPO_URL=${GEUL_TEMPO_URL:?set GEUL_TEMPO_URL}
      - GEUL_POSTGRES_HOST=${GEUL_POSTGRES_HOST:?set GEUL_POSTGRES_HOST}
      - GEUL_POSTGRES_DATABASE=${GEUL_POSTGRES_DATABASE:-geul}
    restart: unless-stopped

volumes:
  grafana_data_prod:
