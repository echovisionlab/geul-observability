name: geul-observability-ui

services:
  grafana-prod:
    image: grafana/grafana:11.5.2
    container_name: geul-grafana-prod
    ports:
      - '3500:3000'
    volumes:
      - ../infra/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ../infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../infra/grafana/provisioning/datasources/datasources.prod.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../infra/grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
      - ../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data_prod:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GEUL_GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GEUL_GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GEUL_GRAFANA_ROOT_URL}
      - GEUL_GRAFANA_POSTGRES_USER=${GEUL_GRAFANA_POSTGRES_USER}
      - GEUL_GRAFANA_POSTGRES_PASSWORD=${GEUL_GRAFANA_POSTGRES_PASSWORD}
      - GEUL_MIMIR_URL=${GEUL_MIMIR_URL:-http://mimir-prod:9009/prometheus}
      - GEUL_LOKI_URL=${GEUL_LOKI_URL:-http://loki-prod:3100}
      - GEUL_TEMPO_URL=${GEUL_TEMPO_URL:-http://tempo-prod:3200}
      - GEUL_POSTGRES_HOST=${GEUL_POSTGRES_HOST:?set GEUL_POSTGRES_HOST}
      - GEUL_POSTGRES_DATABASE=${GEUL_POSTGRES_DATABASE:-geul}
    restart: unless-stopped

volumes:
  grafana_data_prod:
